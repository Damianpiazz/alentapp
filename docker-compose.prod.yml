services:
  db:
    image: postgres:16-alpine
    env_file: .env

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - alentapp-network

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod

    env_file: .env

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

    ports:
      - "3000:3000"
      - "9464:9464"

    networks:
      - alentapp-network

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod

    depends_on:
      api:
        condition: service_healthy

    ports:
      - "8080:80"

    networks:
      - alentapp-network

networks:
  alentapp-network:
    driver: bridge

volumes:
  pgdata: