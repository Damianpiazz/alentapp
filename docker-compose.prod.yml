services:
    db:
        image: postgres:16-alpine
        env_file: .env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            interval: 10s
            timeout: 5s
            retries: 5
        networks: [alentapp-network]
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits: { cpus: '1.0', memory: 1g }
                reservations: { memory: 512m }

    api:
        build:
            context: .
            dockerfile: packages/api/Dockerfile.prod
        env_file: .env
        read_only: true
        cap_drop: [ALL]
        cap_add: [NET_BIND_SERVICE]
        security_opt: [no-new-privileges:true]
        tmpfs: [/tmp]
        depends_on:
            db: { condition: service_healthy }
        healthcheck:
            test: curl -f http://localhost:3000/health || wget -qO- http://localhost:3000/health || exit 1
            interval: 30s
            timeout: 5s
            retries: 3
        networks: [alentapp-network]
        ports:
            - '3000:3000'
            - '9464:9464' # métricas OpenTelemetry
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits: { cpus: '0.5', memory: 512m }
                reservations: { memory: 256m }

    web:
        build:
            context: .
            dockerfile: packages/web/Dockerfile.prod
        read_only: true
        cap_drop: [ALL]
        cap_add: [NET_BIND_SERVICE]
        security_opt: [no-new-privileges:true]
        tmpfs:
            - /var/cache/nginx
            - /var/run
        depends_on:
            api: { condition: service_healthy }
        networks: [alentapp-network]
        ports:
            - '80:80'
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        deploy:
            resources:
                limits: { cpus: '0.25', memory: 128m }
                reservations: { memory: 64m }

networks:
    alentapp-network:
        driver: bridge

volumes:
    pgdata: